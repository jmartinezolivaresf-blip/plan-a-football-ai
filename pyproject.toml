[project]
name = "plan-a"
version = "0.1.0"
description = "Plan A: The Battle of the Benches. Multi-agent match intelligence on synthetic football data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.22",
    "ruff>=0.6",
]
# Person B (H1). Core + Foundry client only (the meta-package pulls pre-release integrations), see D-025.
agents = [
    "agent-framework-core==1.23.0",
    "agent-framework-foundry==1.15.0",
    "mcp==2.3.0",
    "azure-identity==1.26.0",
    "tenacity>=9.1.4,<9.2.0",  # agent-framework MCP tools need it (only in its "all" extra), D-046
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*", "fixtures*", "sim*", "engine*", "eval*", "mcp_server*", "agents*", "pipeline*"]

[tool.setuptools.package-data]
contracts = ["schemas/*.json", "schemas/eval_only/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
